# The live evaluation the README reports, and the source of the Replay site's games: Agents on
# Claude Haiku, on the Host's subscription, with a Detective right 80% of the time or always.
# Small on purpose (the subscription's quota): its intervals are wide, and the README says so.
# Run `uv run mm evaluate ../configs/evaluations/readme.toml` again to go on where it stopped.
name = "readme"
games_per_cell = 5
first_seed = 1

[base]
residents = 8
murderers = 2
max_days = 5

[base.lineup.everyone]
provider = "claude"
model = "claude-haiku-5-5"
effort = "low"

[axes]
detective_accuracy = [0.8, 1.0]

[caps]
games_per_batch = 4
pause_seconds = 30
