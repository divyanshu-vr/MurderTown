# Agents on Claude Haiku, on the Host's subscription: how much does a Detective who is always right
# help the Town? Played a few games at a time, as the subscription's quota allows: run
# `uv run mm evaluate ../configs/evaluations/detective.toml` again to go on where it stopped.
name = "detective"
games_per_cell = 30
first_seed = 1

[base]
residents = 10
murderers = 2
max_days = 6

[base.lineup.everyone]
provider = "claude"
model = "claude-haiku-5-5"
effort = "low"

[axes]
detective_accuracy = [0.8, 1.0]

[caps]
games_per_batch = 3
pause_seconds = 60
