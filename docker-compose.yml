# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: murdertown
      POSTGRES_PASSWORD: murdertown
      POSTGRES_DB: murdertown
    ports:
      - "5433:5432"  # 5433 on the host, so it never clashes with a locally installed Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murdertown -d murdertown"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
