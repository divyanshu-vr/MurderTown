# Local development services. Start with: docker compose up -d
# (add --profile tracing to also run Jaeger)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: murdertown
      POSTGRES_PASSWORD: murdertown
      POSTGRES_DB: murdertown
    ports:
      - "5433:5432"  # 5433 on the host, so it never clashes with a locally installed Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murdertown -d murdertown"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    # Optional: see traces locally. Start with: docker compose --profile tracing up -d
    # then set MM_OTLP_ENDPOINT=http://localhost:4318/v1/traces and open http://localhost:16686
    image: jaegertracing/jaeger:2.22.0
    profiles: ["tracing"]
    ports:
      - "16686:16686"  # the Jaeger UI
      - "4318:4318"    # OTLP over HTTP

volumes:
  postgres-data:
