[project]
name = "murdertown"
version = "0.1.0"
description = "MurderTown backend: a social-deduction game in which every Resident is played by an Agent."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "typer>=0.12",
    "claude-agent-sdk>=0.2",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "structlog>=24.4",
    "anthropic>=2.3.0",
    "openai>=3.40.0",
]

[project.scripts]
mm = "mm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "httpx2>=2.16",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF", "N", "PL"]
ignore = [
    "PLR2004",  # magic numbers read fine in game rules and tests
    "PLR0913",
    "PLR0911",  # one return per event type in `match` dispatch is the house style
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mm"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "mm"

[[tool.importlinter.contracts]]
name = "Layers: the engine knows nothing about agents, LLMs, orchestration, storage or the API"
type = "layers"
layers = [
    "mm.cli",
    "mm.api",
    "mm.persistence",
    "mm.orchestrator",
    "mm.agents",
    "mm.llm",
    "mm.observability",
    "mm.engine",
]
ignore_imports = []
